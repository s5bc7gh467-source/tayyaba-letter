<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>For Tayyaba 🤍</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-glow"></div>

  <main class="wrap">
    <header class="top">
      <div class="tag">For <span class="name">Tayyaba</span> 🤍</div>
      <div class="from">from <span class="name2">Tayyab</span></div>
    </header>

    <section class="stage">
      <div class="hint" id="hint">Tap the envelope</div>

      <button class="envelope" id="envelope" aria-label="Open the letter">
        <div class="env-back"></div>
        <div class="env-front"></div>
        <div class="env-flap"></div>
        <div class="seal">🤍</div>

        <div class="letter" id="letterCard">
          <div class="letter-inner">
            <h1>Happpyyy Girlfriends Day to the LOVEEEE OF MY LIFEEEE 🤍</h1>

            <div class="letter-text" id="letterText">Hello Tayyaba I decided to make this for you to show you how an incredible girlfriend you are and how much I value you and appreciate you as a person.Tayyaba I know you really don’t like me calling you my girlfriend but I had to man so I hope you let it slide🥲🥲💔💔.Youre an inspiration man the days you’re feeling low but you still give ur best make me realise how incredibly proud I am to call you mine, I don’t have enough words  to express my love for you I admire you so much and u genuinely like make me be a better person you’ve like formed me into a really good person,You made me love life u made me laugh u made me enjoy so many laughing nights and I can’t thank you enough im very grateful for you alhumdulillah.Youre the woman of my dreams and I just can’t afford to lose you at any cost🤍The thing i love most about you is how i never have to force anything i can just be so natural with you and we always Enjoy.Time just Goes by so frickin fast with you so i want enjoy Each and every moment with you.Tayyaba trust me when i say this youve made me improve in everything in my life ive gotten closer to Allah because ive made so many duas for you and ur protection and youve just changed Me in a million ways.I wish Some day you realise the things id do for you just to keep u by my side because i really want us to work And achieve everything.Youre very special to me please understand That and i wish you could see yourself thru my eyes and realise what u mean to me. dream To achieve everything with you By myside And honestly if i have u lmao that‘ll actually be my biggest dream achieved🤍
I hope we get better for each other or bhi sath sath becauseee as you say noone is perfect but the ones who change themselves for each other to make them happy are pretty close 🫶😘🤍
With that i end This letter hamesha khush rehna or sath rehna I Love You Happy Girlfriends Day🤍</div>

            <div class="sig">— Tayyab</div>
          </div>
        </div>
      </button>
    </section>

    <section class="after" id="after">
      <div class="music">
        <div class="music-title">Mann Ki Lagan</div>
        <div class="music-sub">If it doesn’t start automatically, tap play.</div>
        <button class="btn" id="playBtn">Play</button>
        <button class="btn ghost" id="pauseBtn">Pause</button>
        <input id="vol" class="vol" type="range" min="0" max="1" step="0.01" value="0.8" />
      </div>

      <h2 class="gallery-title">Photos</h2>
      <div class="gallery" id="gallery"></div>

      <footer class="foot">Made with love 🤍</footer>
    </section>
  </main>

  <audio id="audio" preload="auto" loop>
    <source src="assets/song.mp3" type="audio/mpeg" />
  </audio>

  <script src="script.js"></script>
</body>
</html>
